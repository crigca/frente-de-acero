function drawUnit(u){
  var X=0,Y=0,RX=u.x,RY=u.y;ctx.save();ctx.translate(RX,RY);ctx.scale(U,U);
  var T=TYPES[u.type],r=T.r,col=COL[u.team],tk=u.type==='tank';
  // (la artillería es la única ficha cuadrada, de puntas redondeadas: se distingue de lejos del antitanque)
  function tok(ox,oy,R){
    ctx.beginPath();
    if(u.type!=='art'){ctx.arc(X+ox,Y+oy,R,0,6.2832);return;}
    var h=R*0.93,q=R*0.34,x=X+ox,y=Y+oy;
    ctx.moveTo(x-h+q,y-h);ctx.arcTo(x+h,y-h,x+h,y+h,q);ctx.arcTo(x+h,y+h,x-h,y+h,q);ctx.arcTo(x-h,y+h,x-h,y-h,q);ctx.arcTo(x-h,y-h,x+h,y-h,q);ctx.closePath();
  }
  // Ficha de chapa pintada: canto oscuro, aro color hueso, disco del color del bando con brillo arriba y sombra abajo
  var amb=u.type==='amb',at=u.type==='at',art=u.type==='art',cmd=u.type==='cmd';
  ctx.fillStyle='rgba(0,0,0,.4)';tok(1.2,3,r+2.2);ctx.fill();
  ctx.fillStyle='#15180f';tok(0,0,r+2.4);ctx.fill();                       // canto
  ctx.fillStyle=amb?col.fill:cmd?'#ffd60a':'#e9e3c4';tok(0,0,r+1.3);ctx.fill();          // aro (dorado: comandante)
  ctx.fillStyle=amb?'#efe9cf':tk?col.dark:col.fill;tok(0,0,r-1.6);ctx.fill();   // disco
  ctx.save();tok(0,0,r-1.6);ctx.clip();
  if(art){ctx.fillStyle=col.dark;ctx.beginPath();ctx.moveTo(X+r*0.35,Y-r);ctx.lineTo(X+r,Y-r);ctx.lineTo(X+r,Y+r);ctx.lineTo(X-r*0.35,Y+r);ctx.closePath();ctx.fill();}   // artillería: disco partido en dos tonos
  ctx.fillStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.arc(X,Y-r*0.95,r*1.05,0,6.2832);ctx.fill();      // brillo
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.arc(X,Y+r*1.5,r*1.15,0,6.2832);ctx.fill();              // sombra
  ctx.restore();
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=0.9;tok(0,0,r-1.6);ctx.stroke();
  if(tk){ctx.strokeStyle=col.edge;ctx.lineWidth=1.8;tok(0,0,r-3.4);ctx.stroke();}        // tanque: disco oscuro con aro del bando
  if(at){ctx.strokeStyle=col.dark;ctx.lineWidth=2.2;ctx.setLineDash([4.2,2.6]);tok(0,0,r-3.2);ctx.stroke();ctx.setLineDash([]);}   // antitanque: aro punteado
  icon(u.type,X,Y,tk?0.95:at?0.85:art?0.82:cmd?0.95:1.05,u.team,amb?'#c22a20':col.dark);
  if(u.sel){
    ctx.strokeStyle='#ffd60a';ctx.lineWidth=2.5;ctx.setLineDash([5,3.5]);
    ctx.beginPath();ctx.arc(X,Y,r+5.5,0,6.2832);ctx.stroke();ctx.setLineDash([]);
  }
  if(u.flash>0&&u.tgt){
    var dx=u.tgt.x-RX,dy=u.tgt.y-RY,l=Math.sqrt(dx*dx+dy*dy)||1;
    ctx.fillStyle='#ffe95c';ctx.beginPath();ctx.arc(X+dx/l*r,Y+dy/l*r,tk?4.5:3,0,6.2832);ctx.fill();
  }
  if(u.hp<T.hp){
    var w=r*2,f=Math.max(0,u.hp/T.hp);
    ctx.fillStyle='#0b0d12';ctx.fillRect(X-r-1,Y+r+3,w+2,5);
    ctx.fillStyle=f>0.5?'#3ddc6a':f>0.25?'#ffc233':'#ff4b3a';ctx.fillRect(X-r,Y+r+4,w*f,3);
  }
  if(u.healing){             // cruz verde: se está reparando en un hospital
    var gx=X-r*0.85,gy=Y-r*0.85;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(gx,gy,5.5,0,6.2832);ctx.fill();
    ctx.fillStyle='#19b84a';ctx.fillRect(gx-1.3,gy-4,2.6,8);ctx.fillRect(gx-4,gy-1.3,8,2.6);
  }
  if(fortified(u)){          // escudo: protegida por la fábrica
    var sx=X+r*0.8,sy=Y+r*0.75;
    ctx.beginPath();ctx.moveTo(sx-4.5,sy-5);ctx.lineTo(sx+4.5,sy-5);ctx.lineTo(sx+4.5,sy);
    ctx.quadraticCurveTo(sx+4,sy+4.5,sx,sy+6);ctx.quadraticCurveTo(sx-4,sy+4.5,sx-4.5,sy);ctx.closePath();
    ctx.fillStyle='#e9e9e2';ctx.fill();ctx.strokeStyle='#1b211f';ctx.lineWidth=1.2;ctx.stroke();
  }
  if(u.hungry){
    ctx.fillStyle='#ff9f0a';ctx.beginPath();ctx.arc(X+r*0.8,Y-r*0.8,5.5,0,6.2832);ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#000';ctx.font='bold 9px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('!',X+r*0.8,Y-r*0.8+0.5);
  }
  ctx.restore();
}

// Menú de la fábrica elegida: dos botones (infantería / tanque) con su precio
function drawMenu(){
  menuRects=[];menuBox=null;
  if(!menu)return;
  if(menu.owner!==BLUE||!menu.type||cities.indexOf(menu)<0){menu=null;return;}
  // Recuadro chico, del mismo estilo que el de las fichas apiladas: una fila de botones (ícono y precio),
  // la cola en casilleros mínimos y una línea de ayuda. Tamaño fijo en pantalla (S), con cualquier zoom.
  var S=uiU(),types=PROD[menu.type],n=types.length,pad=4*S,bw=45*S,bh=21*S,gap=3*S,qs=17*S,qg=2.5*S;
  var w=n*bw+(n-1)*gap+2*pad,h=pad+bh+4*S+qs+3*S+9*S+pad;
  var vx0=Math.max(0,view.ox),vy0=Math.max(0,view.oy),vx1=Math.min(WX,view.ox+visW()),vy1=Math.min(WY,view.oy+visH());   // parte del tablero que se ve
  var px=Math.max(vx0+4*S,Math.min(vx1-4*S-w,menu.x-w/2)),py=menu.y-33*U-5*S-h;
  if(py<vy0+4*S)py=menu.y+28*U+5*S;
  if(py+h>vy1-4*S)py=Math.max(vy0+4*S,vy1-4*S-h);
  menuBox={x:px,y:py,w:w,h:h};
  rrect(px,py,w,h,5*S);ctx.fillStyle='rgba(30,35,24,.93)';ctx.fill();ctx.strokeStyle='#8a8f66';ctx.lineWidth=1.2*S;ctx.stroke();
  function mini(type,cx,cy,r){                 // ficha en miniatura
    var amb=type==='amb',col=COL[BLUE];
    ctx.fillStyle=amb?col.fill:type==='cmd'?'#ffd60a':'#e9e3c4';ctx.beginPath();ctx.arc(cx,cy,r,0,6.2832);ctx.fill();
    ctx.fillStyle=amb?'#efe9cf':(type==='tank'||type==='art')?col.dark:col.fill;ctx.beginPath();ctx.arc(cx,cy,r*0.84,0,6.2832);ctx.fill();
    icon(type,cx,cy,(type==='inf'||amb?0.065:0.055)*r,BLUE,amb?'#c22a20':col.dark);
  }
  var x0=px+pad,by=py+pad;
  // botones: qué fabricar
  types.forEach(function(type,k){
    var bx=x0+k*(bw+gap),why=canBuy(type),ok=!why;
    menuRects.push({x:bx,y:by,w:bw,h:bh,type:type});
    rrect(bx,by,bw,bh,4*S);
    ctx.fillStyle=ok?'rgba(255,214,10,.13)':'rgba(255,255,255,.05)';ctx.fill();
    ctx.strokeStyle=ok?'rgba(255,214,10,.85)':'rgba(255,255,255,.2)';ctx.lineWidth=1*S;ctx.stroke();
    ctx.globalAlpha=ok?1:0.45;mini(type,bx+11*S,by+bh/2,8.2*S);ctx.globalAlpha=1;
    ctx.font='bold '+(10.5*S).toFixed(2)+'px system-ui,Arial,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle=ok?'#ffd60a':(why==='oro'?'#ff8a7d':'#9a9a8c');
    ctx.fillText(COST[type],bx+21.5*S,by+bh/2+0.5*S);
  });
  // cola de producción: casilleros; el primero muestra el avance, y un click en cualquiera lo cancela
  var qy=by+bh+4*S;
  for(var q=0;q<QMAX;q++){
    var sx=x0+q*(qs+qg),t=menu.queue[q];
    rrect(sx,qy,qs,qs,3*S);ctx.fillStyle=t?'rgba(0,0,0,.35)':'rgba(255,255,255,.05)';ctx.fill();
    ctx.strokeStyle=t?(q===0?'#ffd60a':'#8a8f66'):'rgba(255,255,255,.14)';ctx.lineWidth=0.9*S;ctx.stroke();
    if(!t)continue;
    menuRects.push({x:sx,y:qy,w:qs,h:qs,cancel:q});
    mini(t,sx+qs/2,qy+qs/2-(q===0?1.5*S:0),5.8*S);
    if(q===0){
      var pr=Math.min(1,menu.bt/buildTime(menu,t));
      ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(sx+2*S,qy+qs-4*S,qs-4*S,2.4*S);
      ctx.fillStyle='#ffd60a';ctx.fillRect(sx+2*S,qy+qs-4*S,(qs-4*S)*pr,2.4*S);
    }
  }
  ctx.textAlign='right';ctx.textBaseline='middle';ctx.font='bold '+(8.5*S).toFixed(2)+'px system-ui,Arial,sans-serif';
  if(menu.queue.length){
    var left=Math.max(0,Math.ceil(buildTime(menu,menu.queue[0])-menu.bt));
    ctx.fillStyle='#ffd60a';ctx.fillText(left>0?left+' s':'sin lugar',px+w-pad,qy+qs/2);
  }else{ctx.fillStyle='#8f937c';ctx.fillText('cola vacía',px+w-pad,qy+qs/2);}
  // última línea: un aviso si hay algo que decir; si no, cómo se usa el punto de reunión
  var why0=canBuy(types[0]),note=why0==='cola'?'Cola llena':why0==='tope'?'Tope de fichas':menu.home!==menu.owner?'Tomado: tarda el doble':'';
  ctx.textAlign='left';ctx.textBaseline='top';ctx.font='bold '+(7*S).toFixed(2)+'px system-ui,Arial,sans-serif';
  ctx.fillStyle=note?'#ffb0a6':menu.rally>=0?'#ffd60a':'#a9ad98';
  ctx.fillText(note||(menu.rally>=0?'⚑ Reunión marcada · der. aquí: quitar':'⚑ Click der. en el mapa: reunión'),x0,qy+qs+3*S);
}

// Fichas quietas en el hexágono k (una pila si son 2 o más)
function stackUnits(k){
  return units.filter(function(u){return u.hp>0&&u.c===k&&u.x===hx[k]&&u.y===hy[k];});
}
// Unidad de medida de los recuadros flotantes: 1,25 px de pantalla, con cualquier zoom (no crecen al acercar la vista)
function uiU(){return 1.25/(scale*view.z);}
// Panel de pila: una lista chica al costado del hexágono, con una fila por ficha apilada (ícono y barra de vida).
// Al pasar el mouse se ve; con un click en la pila queda fijo y cada fila se puede clickear para elegir esa ficha.
function drawStackPanel(k,pinned){
  var list=stackUnits(k);
  if(list.length<2){if(pinned)stackPin=-1;return;}
  var S=uiU(),rw=62*S,rh=21*S,pad=4*S,w=rw+2*pad,h=list.length*rh+2*pad;
  var vx0=Math.max(0,view.ox),vy0=Math.max(0,view.oy),vx1=Math.min(WX,view.ox+visW()),vy1=Math.min(WY,view.oy+visH());
  var x0=hx[k]+25*U+6*S;
  if(x0+w>vx1-4*S)x0=hx[k]-25*U-6*S-w;
  var y0=Math.max(vy0+4*S,Math.min(vy1-4*S-h,hy[k]-h/2));
  if(menuBox&&x0<menuBox.x+menuBox.w&&x0+w>menuBox.x&&y0<menuBox.y+menuBox.h&&y0+h>menuBox.y){     // que no se encime con el menú del edificio
    y0=menuBox.y+menuBox.h+5*S;
    if(y0+h>vy1-4*S)y0=menuBox.y-h-5*S;
  }
  rrect(x0,y0,w,h,5*S);ctx.fillStyle='rgba(30,35,24,.93)';ctx.fill();
  ctx.strokeStyle=pinned?'#ffd60a':'#8a8f66';ctx.lineWidth=1.2*S;ctx.stroke();
  list.forEach(function(u,n){
    var ry=y0+pad+n*rh,cx=x0+pad+10*S,cy=ry+rh/2,col=COL[u.team],T=TYPES[u.type],amb=u.type==='amb';
    if(u.sel){rrect(x0+pad*0.5,ry+1*S,w-pad,rh-2*S,3*S);ctx.fillStyle='rgba(255,214,10,.2)';ctx.fill();}
    ctx.fillStyle=amb?col.fill:u.type==='cmd'?'#ffd60a':'#e9e3c4';ctx.beginPath();ctx.arc(cx,cy,8.6*S,0,6.2832);ctx.fill();
    ctx.fillStyle=amb?'#efe9cf':(u.type==='tank'||u.type==='art')?col.dark:col.fill;ctx.beginPath();ctx.arc(cx,cy,7.2*S,0,6.2832);ctx.fill();
    icon(u.type,cx,cy,(u.type==='inf'?0.56:u.type==='amb'?0.56:0.47)*S,u.team,amb?'#c22a20':col.dark);
    var bx=cx+13*S,bw=rw-23*S-pad,f=Math.max(0,Math.min(1,u.hp/T.hp));
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,cy-2.2*S,bw,4.4*S);
    ctx.fillStyle=f>0.6?'#7fd06a':f>0.3?'#ffd60a':'#ff6a5a';ctx.fillRect(bx,cy-2.2*S,bw*f,4.4*S);
    if(pinned&&u.team===BLUE)stackRects.push({x:x0,y:ry,w:w,h:rh,u:u});
  });
}

function drawMinimap(){
  var dpr=Math.min(2,window.devicePixelRatio||1),chh=mmEl.clientHeight||86,cww=Math.round(chh*WX/WY);
  var w=Math.round(cww*dpr),h=Math.round(chh*dpr),k,i,m=mmCtx;
  if(mmEl.width!==w||mmEl.height!==h){mmEl.width=w;mmEl.height=h;mmEl.style.width=cww+'px';}
  var sx=w/WX,sy=h/WY,cw=HW*sx+0.6,ch=1.5*HS*sy+0.6;
  if(!mmCv)mmCv=document.createElement('canvas');
  if(mmVer!==ownVer||mmCv.width!==w||mmCv.height!==h){      // fondo (terreno + territorio): solo cuando cambia
    mmCv.width=w;mmCv.height=h;mmVer=ownVer;
    var mc=mmCv.getContext('2d');
    if(terrCv)mc.drawImage(terrCv,0,0,w,h);
    for(k=0;k<NC;k++){
      mc.fillStyle=own[k]>0?'rgba(30,100,255,.42)':'rgba(255,45,30,.42)';
      mc.fillRect((hx[k]-HW/2)*sx,(hy[k]-0.75*HS)*sy,cw,ch);
    }
  }
  m.setTransform(1,0,0,1,0,0);
  m.drawImage(mmCv,0,0);
  for(i=0;i<cities.length;i++){
    var c=cities[i],q=c.type?2.5*dpr:3.5*dpr;
    m.fillStyle=c.owner===NEUTRAL?'#e8e8dc':COL[c.owner].fill;m.strokeStyle=c.type?'#000':'#fff';m.lineWidth=dpr;
    m.fillRect(c.x*sx-q,c.y*sy-q,2*q,2*q);m.strokeRect(c.x*sx-q,c.y*sy-q,2*q,2*q);
  }
  for(i=0;i<units.length;i++){
    var u=units[i];
    m.fillStyle=u.team===BLUE?'#bfe0ff':'#ffd0c8';m.beginPath();m.arc(u.x*sx,u.y*sy,1.8*dpr,0,6.2832);m.fill();
  }
  m.strokeStyle='#fff';m.lineWidth=1.5*dpr;
  m.strokeRect(Math.max(0,view.ox)*sx,Math.max(0,view.oy)*sy,Math.min(WX,visW())*sx,Math.min(WY,visH())*sy);
}

function draw(){
  // Fondo: la mesa de mapas (verde oliva oscuro con vetas), que se ve alrededor del tablero cuando se aleja la vista al máximo
  ctx.setTransform(1,0,0,1,0,0);
  if(!tableCv||tableCv.width!==cv.width||tableCv.height!==cv.height){
    tableCv=document.createElement('canvas');tableCv.width=cv.width;tableCv.height=cv.height;
    var tc=tableCv.getContext('2d'),tg=tc.createLinearGradient(0,0,0,cv.height);
    tg.addColorStop(0,'#3a4129');tg.addColorStop(1,'#272c1c');tc.fillStyle=tg;tc.fillRect(0,0,cv.width,cv.height);
    tc.strokeStyle='rgba(0,0,0,.13)';tc.lineWidth=1;
    for(var ty=3;ty<cv.height;ty+=7){tc.beginPath();tc.moveTo(0,ty);tc.lineTo(cv.width,ty+((ty*7)%5)-2);tc.stroke();}
  }
  ctx.drawImage(tableCv,0,0);
  if(needCenter){centerView();needCenter=false;}
  var zs=scale*view.z;ctx.setTransform(zs,0,0,zs,-view.ox*zs,-view.oy*zs);
  drawBoard();
  var i,u;
  cities.forEach(drawCity);
  cities.forEach(function(o){             // avance de lo que se está fabricando
    if(o.owner!==BLUE||!o.queue||!o.queue.length)return;      // solo las propias: lo que fabrica el enemigo no se ve
    var pr=Math.min(1,o.bt/buildTime(o,o.queue[0]));
    ctx.lineCap='butt';
    ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=6*U;ctx.beginPath();ctx.arc(o.x,o.y,25*U,0,6.2832);ctx.stroke();
    ctx.strokeStyle='#ffd60a';ctx.lineWidth=4*U;ctx.beginPath();ctx.arc(o.x,o.y,25*U,-1.5708,-1.5708+6.2832*pr);ctx.stroke();
  });
  // Puntos de reunión de las fábricas propias: un banderín amarillo; con el menú de esa fábrica abierto, también la línea
  cities.forEach(function(o){
    if(o.owner!==BLUE||!o.type||o.rally<0)return;
    var rx=hx[o.rally],ry=hy[o.rally],on=menu===o;
    if(on){
      ctx.strokeStyle='rgba(255,214,10,.85)';ctx.lineWidth=2.2;ctx.setLineDash([7,6]);
      ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(rx,ry);ctx.stroke();ctx.setLineDash([]);
    }
    ctx.globalAlpha=on?1:0.75;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(rx,ry+9*U,6*U,2.2*U,0,0,6.2832);ctx.fill();
    ctx.strokeStyle='#f1ecd2';ctx.lineWidth=2*U;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(rx,ry+9*U);ctx.lineTo(rx,ry-13*U);ctx.stroke();
    ctx.fillStyle='#ffd60a';ctx.strokeStyle='#1b1400';ctx.lineWidth=1*U;
    ctx.beginPath();ctx.moveTo(rx,ry-13*U);ctx.lineTo(rx+11*U,ry-9*U);ctx.lineTo(rx,ry-5*U);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.globalAlpha=1;
  });
  // Alcance de las fichas elegidas: círculo punteado (amarillo: hasta dónde tira; rojo: zona pegada donde la artillería no puede tirar;
  // verde: hasta dónde cura el médico; dorado: hasta dónde llega el bonus del comandante)
  var rz=1/(scale*view.z);
  function ring(u,R,stroke,fill){
    ctx.beginPath();ctx.arc(u.x,u.y,R,0,6.2832);
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    ctx.strokeStyle=stroke;ctx.stroke();
  }
  ctx.lineWidth=1.5*rz;ctx.setLineDash([7*rz,5*rz]);
  units.forEach(function(u){
    if(!u.sel||u.team!==BLUE)return;
    var T=TYPES[u.type];
    if(u.type==='amb')ring(u,HOSP_R+HW*0.38,'rgba(120,230,130,.85)','rgba(120,230,130,.06)');
    else if(u.type==='cmd')ring(u,CMD_R+HW*0.38,'rgba(255,214,10,.9)','rgba(255,214,10,.06)');
    else{
      ring(u,T.range+HW*0.38,'rgba(255,240,170,.8)','rgba(255,240,170,.045)');
      if(T.minRange)ring(u,T.minRange-HW*0.38,'rgba(255,90,70,.9)','rgba(255,90,70,.1)');
    }
  });
  ctx.setLineDash([]);
  // Flechas de las órdenes: se ven 10 segundos y desaparecen; vuelven al seleccionar la ficha
  for(i=0;i<units.length;i++){
    u=units[i];
    if(u.team!==BLUE||(u.dc<0&&!u.focus))continue;
    var age=u.sel?0:time-u.ordT;if(age>=10)continue;   // seleccionada: siempre muestra su flecha
    var red=!!u.focus;
    var ex=red?u.focus.x:hx[u.dc],ey=red?u.focus.y:hy[u.dc],ax=ex-u.x,ay=ey-u.y,al=Math.sqrt(ax*ax+ay*ay);
    if(al<12)continue;
    ax/=al;ay/=al;
    ctx.globalAlpha=Math.min(1,10-age)*0.85;
    ctx.strokeStyle=ctx.fillStyle=red?'#ff5a4d':'#fff';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.setLineDash([8,7]);
    ctx.beginPath();ctx.moveTo(u.x,u.y);ctx.lineTo(ex-ax*12,ey-ay*12);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-ax*15-ay*8,ey-ay*15+ax*8);ctx.lineTo(ex-ax*15+ay*8,ey-ay*15-ax*8);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
  }
  // Fichas en el mismo lugar (apiladas, quietas o viajando juntas): se dibujan en abanico con un cartel ×N
  var stack={},seen={},key;
  for(i=0;i<units.length;i++){u=units[i];key=Math.round(u.x)+','+Math.round(u.y);stack[key]=(stack[key]||0)+1;}
  for(i=0;i<units.length;i++){
    u=units[i];key=Math.round(u.x)+','+Math.round(u.y);
    var n=stack[key];
    if(n>1){
      var j=seen[key]||0;seen[key]=j+1;
      var ox=(j-(n-1)/2)*11*U,rx=u.x;
      u.x=rx+ox;drawUnit(u);u.x=rx;
      if(j===n-1){
        var bx=rx-19*U,by=u.y+19*U,tx='×'+n;
        ctx.fillStyle='#ffd60a';ctx.beginPath();ctx.arc(bx,by,9.5*U,0,6.2832);ctx.fill();ctx.strokeStyle='#1b1400';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#1b1400';ctx.font='bold '+Math.round(11*U)+'px system-ui,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(tx,bx,by+0.5);
      }
    }else drawUnit(u);
  }
  for(i=0;i<fx.length;i++){
    var f=fx[i],a=Math.max(0,f.t/f.d);
    if(f.k==='shot'){
      ctx.strokeStyle='rgba(255,236,110,'+a+')';ctx.lineWidth=f.w;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();
      if(f.w>2){ctx.fillStyle='rgba(255,170,60,'+a+')';ctx.beginPath();ctx.arc(f.x2,f.y2,6,0,6.2832);ctx.fill();}
    }else if(f.k==='ring'){
      ctx.strokeStyle=COL[f.team].edge;ctx.globalAlpha=a;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r+(1-a)*18,0,6.2832);ctx.stroke();ctx.globalAlpha=1;
    }else if(f.k==='atk'){
      ctx.strokeStyle='#ff3b2f';ctx.globalAlpha=a;ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(f.x,f.y,12+(1-a)*22,0,6.2832);ctx.stroke();ctx.globalAlpha=1;
    }else if(f.k==='mark'){
      ctx.strokeStyle='#ffd60a';ctx.globalAlpha=a;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(f.x,f.y,9+(1-a)*20,0,6.2832);ctx.stroke();ctx.globalAlpha=1;
    }
  }
  if(attackMode&&hover){
    var he=enemyAt(hover);
    if(he){ctx.strokeStyle='#ff3b2f';ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(he.x,he.y,TYPES[he.type].R+7,0,6.2832);ctx.stroke();}
  }
  drawMenu();
  stackRects=[];
  {
    if(stackPin>=0)drawStackPanel(stackPin,true);
    else if(hover&&!drag&&!rdrag){
      var hk2=hexAt(hover.x,hover.y);
      if((hover.x-hx[hk2])*(hover.x-hx[hk2])+(hover.y-hy[hk2])*(hover.y-hy[hk2])<HS*HS)drawStackPanel(hk2,false);
    }
  }
  if(drag&&drag.rect){
    var x=Math.min(drag.x0,drag.x1),y=Math.min(drag.y0,drag.y1),w=Math.abs(drag.x1-drag.x0),h=Math.abs(drag.y1-drag.y0);
    ctx.fillStyle='rgba(255,214,10,.15)';ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='#ffd60a';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);
  }
  drawMinimap();
}

// ---------- Marcador ----------
function clock(){var s=Math.floor(time);return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function updateHud(){
  var bc=0,rc=0,bu=0,ru=0,fl=fabCount();
  cities.forEach(function(c){if(c.owner===BLUE)bc++;else if(c.owner===RED)rc++;});
  units.forEach(function(u){if(u.team===BLUE)bu++;else ru++;});
  $('bp').textContent=Math.round(pct[BLUE])+'%';$('rp').textContent=Math.round(pct[RED])+'%';
  $('bc').textContent=fl[0];$('rc').textContent=fl[1];
  $('bu').textContent=bu+'/'+bc*SUPPLY;$('ru').textContent=ru+'/'+rc*SUPPLY;
  $('bg').textContent=$('hGold').textContent=Math.floor(gold[BLUE]);
  $('hBp').textContent=$('bp').textContent;$('hRp').textContent=$('rp').textContent;
  $('barBlue').style.width=pct[BLUE]+'%';
  $('clock').textContent=clock();
  var st;
  if(over)st=over==='win'?'Ganaste':'Perdiste';
  else st=(bonus&&time-bonus.t<6)?'+'+bonus.v+' oro por territorio':'';
  $('status').textContent=st;
}

function pos(e){
  var r=cv.getBoundingClientRect();
  var f=cv.width/r.width,zs=scale*view.z;
  return {x:(e.clientX-r.left)*f/zs+view.ox,y:(e.clientY-r.top)*f/zs+view.oy};
}
function unitAt(p){
  var best=null,bd=1e18;
  units.forEach(function(u){
    if(u.team!==BLUE)return;
    var R=TYPES[u.type].R+8,dd=d2(u,p);
    if(dd<=R*R&&(dd<bd-1||(best&&Math.abs(dd-bd)<=1&&u.id>best.id))){bd=dd;best=u;}
  });
  return best;
}
function enemyAt(p){
  var best=null,bd=1e18;
  units.forEach(function(u){
    if(u.team===BLUE)return;
    var R=TYPES[u.type].R+8,dd=d2(u,p);
    if(dd<=R*R&&dd<bd){bd=dd;best=u;}
  });
  return best;
}
// Puntero de ataque: una mira roja bien visible
var ATK_CURSOR=(function(){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">'+
    '<g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"><circle cx="20" cy="20" r="11"/><path d="M20 2v10M20 28v10M2 20h10M28 20h10"/></g>'+
    '<g fill="none" stroke="#e8170c" stroke-width="3.6" stroke-linecap="round"><circle cx="20" cy="20" r="11"/><path d="M20 2v10M20 28v10M2 20h10M28 20h10"/></g>'+
    '<circle cx="20" cy="20" r="2.6" fill="#e8170c" stroke="#fff" stroke-width="1.2"/></svg>';
  return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'") 20 20, crosshair';
})();
// La mira aparece en modo ataque, y también al pasar sobre un enemigo con fichas seleccionadas (click derecho = atacar)
function updCursor(){
  if(locked()&&document.elementFromPoint(vcur.x,vcur.y)!==cv){if(fakeCur.className)fakeCur.className='';return;}   // sobre el panel: flecha común
  var atk=attackMode;
  if(!atk&&hover&&enemyAt(hover))atk=units.some(function(u){return u.sel&&u.team===BLUE;});
  var c=atk?ATK_CURSOR:'default';
  if(cv.style.cursor!==c)cv.style.cursor=c;
  if(fakeCur.className!==(atk?'atk':''))fakeCur.className=atk?'atk':'';
}
function setAttack(v){
  attackMode=v&&!over;
  $('btnAtk').classList.toggle('on',attackMode);
  $('btnAtk').textContent=attackMode?'⚔ Elegí el blanco…':'⚔ ATACAR (X)';
  updCursor();
}
// Orden de ataque: las fichas elegidas van hacia donde está esa ficha enemiga y le disparan a ella primero.
// No la persiguen: si el blanco cambia de hexágono, terminan de llegar al lugar original y se quedan ahí.
function attackOrder(target){
  var list=units.filter(function(u){return u.sel&&u.team===BLUE&&u.type!=='amb';});
  if(!list.length||over)return false;
  order(list,target.x,target.y);
  list.forEach(function(u){u.focus=target;u.dis=false;});
  fx.push({k:'atk',x:target.x,y:target.y,t:0.7,d:0.7});
  units.forEach(function(u){u.sel=false;});stackPin=-1;
  return true;
}
function moveOrder(p){
  var list=units.filter(function(u){return u.sel&&u.team===BLUE;});
  if(!list.length||over)return;
  list.forEach(function(u){u.focus=null;});stackPin=-1;menu=null;
  var k=hexAt(p.x,p.y);
  order(list,hx[k],hy[k]);
  fx.push({k:'mark',x:hx[k],y:hy[k],t:0.6,d:0.6});
  list.forEach(function(u){u.sel=false;});   // dada la orden, se deselecciona
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  var p=pos(e);
  if(e.button===2){                              // botón derecho: solo órdenes (destino, ataque, menú del edificio, punto de reunión)
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    rdrag={x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};return;
  }
  if(e.button!==0)return;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  // Arrastre con el botón izquierdo: dibuja el rectángulo de selección (con Shift, suma a lo ya elegido).
  // El mapa se mueve llevando el mouse a un borde de la ventana, con las flechas, con el botón del medio o en el minimapa.
  drag={x0:p.x,y0:p.y,x1:p.x,y1:p.y,rect:false,shift:e.shiftKey,id:e.pointerId};
});
cv.addEventListener('pointermove',function(e){
  hover=pos(e);
  if(rdrag&&e.pointerId===rdrag.id)return;
  if(!drag||e.pointerId!==drag.id)return;
  var p=pos(e);drag.x1=p.x;drag.y1=p.y;
  if(Math.abs(p.x-drag.x0)>8||Math.abs(p.y-drag.y0)>8)drag.rect=true;
});
cv.addEventListener('pointerup',function(e){
  if(rdrag&&e.pointerId===rdrag.id&&e.button===2){
    var rd=rdrag;rdrag=null;
    if(!rd.moved){
      var rp=pos(e),re=enemyAt(rp);
      var rfab=ownFabAt(rp),rsel=units.filter(function(u){return u.sel&&u.team===BLUE;});
      if(menu&&menuBox&&rp.x>=menuBox.x&&rp.x<=menuBox.x+menuBox.w&&rp.y>=menuBox.y&&rp.y<=menuBox.y+menuBox.h){}   // sobre el menú abierto: nada
      else if(attackMode&&!re)setAttack(false);
      else if(re&&attackOrder(re))setAttack(false);       // click derecho sobre un enemigo: atacarlo
      else if(rfab&&(!rsel.length||rsel.every(function(u){return u.c===rfab.k;}))){
        if(menu===rfab&&rfab.rally>=0)rfab.rally=-1;        // con el menú ya abierto: otro click derecho en la fábrica quita el punto de reunión
        menu=rfab;stackPin=-1;                              // sobre una fábrica propia: menú de producción
      }
      else if(menu&&!rsel.length&&cities.indexOf(menu)>=0&&menu.owner===BLUE){   // menú abierto y nada elegido: click derecho en el mapa = punto de reunión
        var rk=hexAt(rp.x,rp.y);menu.rally=rk===menu.k?-1:rk;
        fx.push({k:'mark',x:hx[rk],y:hy[rk],t:0.6,d:0.6});
      }
      else moveOrder(rp);
    }
    return;
  }
  if(!drag||e.pointerId!==drag.id)return;
  var g=drag;drag=null;
  var p=pos(e);
  if(g.rect){
    var x0=Math.min(g.x0,p.x),x1=Math.max(g.x0,p.x),y0=Math.min(g.y0,p.y),y1=Math.max(g.y0,p.y);
    units.forEach(function(u){
      if(u.team!==BLUE)return;
      var inside=u.x>=x0&&u.x<=x1&&u.y>=y0&&u.y<=y1;
      u.sel=inside||(g.shift&&u.sel);
    });
    return;
  }
  if(attackMode){                                // modo ataque: click sobre la ficha enemiga a atacar
    var at=enemyAt(p);
    if(at)attackOrder(at);
    setAttack(false);
    return;
  }
  // ¿click en un botón del menú de fábrica?
  for(var mi=0;mi<menuRects.length;mi++){
    var m=menuRects[mi];
    if(p.x>=m.x&&p.x<=m.x+m.w&&p.y>=m.y&&p.y<=m.y+m.h){if(m.cancel!==undefined)cancelBuild(menu,m.cancel);else buy(m.type);return;}
  }
  if(menuBox&&p.x>=menuBox.x&&p.x<=menuBox.x+menuBox.w&&p.y>=menuBox.y&&p.y<=menuBox.y+menuBox.h)return;   // click dentro del menú, fuera de los botones
  // ¿click en una ficha del panel de pila? -> elegir exactamente esa (también la de abajo del todo)
  for(var si=0;si<stackRects.length;si++){
    var sr=stackRects[si];
    if(p.x>=sr.x&&p.x<=sr.x+sr.w&&p.y>=sr.y&&p.y<=sr.y+sr.h){
      if(g.shift)sr.u.sel=!sr.u.sel;else units.forEach(function(v){v.sel=v===sr.u;});
      return;
    }
  }
  var u=unitAt(p);                              // click izquierdo: seleccionar
  stackPin=(u&&stackUnits(u.c).length>1&&u.x===hx[u.c]&&u.y===hy[u.c])?u.c:-1;   // click en una pila: fija su panel
  // click en una fábrica propia: abre su menú para elegir qué fabricar
  var fab=null;
  cities.forEach(function(c){if(c.owner===BLUE&&c.type&&d2(c,p)<24*U*24*U)fab=c;});
  var touchMove=e.pointerType==='touch'&&!u&&units.some(function(v){return v.sel;});
  menu=fab&&!touchMove&&(!u||e.pointerType==='touch')?fab:null;
  if(fab&&!u&&!touchMove){units.forEach(function(v){v.sel=false;});return;}
  if(u){
    var now=performance.now();
    if(lastClick.id===u.id&&now-lastClick.t<380){
      var vx0=view.ox,vy0=view.oy,vx1=view.ox+visW(),vy1=view.oy+visH();     // doble click: todas las de ese tipo que se ven en pantalla
      units.forEach(function(v){var on=v.team===BLUE&&v.type===u.type&&v.x>=vx0&&v.x<=vx1&&v.y>=vy0&&v.y<=vy1;v.sel=g.shift?(v.sel||on):on;});
    }else if(g.shift)u.sel=!u.sel;
    else units.forEach(function(v){v.sel=v===u;});
    lastClick={id:u.id,t:now};
  }else if(e.pointerType==='touch')moveOrder(p);          // en pantalla táctil no hay botón derecho
  else if(!g.shift)units.forEach(function(v){v.sel=false;});
});
cv.addEventListener('pointercancel',function(){drag=null;pan=null;rdrag=null;});
// Zoom con la rueda (hacia el cursor); paneo con el botón del medio o las flechas
// La vista nunca se sale del tablero; si el tablero entra entero en algún sentido, queda centrado
function visW(){return cv.width/(scale*view.z);}
function visH(){return cv.height/(scale*view.z);}
// Zoom mínimo: el mapa entero a la vista (si no tiene la forma de la pantalla, alrededor se ve la mesa).
function zmin(){return 1;}
function clampView(){
  if(view.z<zmin())view.z=zmin();
  var w=visW(),h=visH();
  view.ox=w>=WX?(WX-w)/2:Math.max(0,Math.min(WX-w,view.ox));
  view.oy=h>=WY?(WY-h)/2:Math.max(0,Math.min(WY-h,view.oy));
}
// Al empezar: acercado sobre tus fábricas
function centerView(){
  // zoom inicial: entran unas 22 columnas a lo ancho de la ventana, así las fichas se ven de buen tamaño
  view.z=Math.max(zmin(),Math.min(ZMAX,cv.width/(scale*(VIEW_COLS+0.5)*HW)));
  var fx0=0,fy0=0;FABS.forEach(function(k){fx0+=hx[k]/FABS.length;fy0+=hy[k]/FABS.length;});
  view.ox=fx0-visW()*0.42;view.oy=fy0-visH()/2;clampView();
}
function mmGo(e){               // click o arrastre en el minimapa: lleva la vista a ese punto
  var r=mmEl.getBoundingClientRect();
  view.ox=(e.clientX-r.left)/r.width*WX-visW()/2;view.oy=(e.clientY-r.top)/r.height*WY-visH()/2;clampView();
}
mmEl.addEventListener('pointerdown',function(e){e.preventDefault();mmDrag=true;try{mmEl.setPointerCapture(e.pointerId);}catch(err){}mmGo(e);});
mmEl.addEventListener('pointermove',function(e){if(mmDrag)mmGo(e);});
mmEl.addEventListener('pointerup',function(){mmDrag=false;});
mmEl.addEventListener('pointercancel',function(){mmDrag=false;});
mmEl.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect(),p=pos(e);
  view.z=Math.max(zmin(),Math.min(ZMAX,view.z*(e.deltaY<0?1.15:1/1.15)));
  var f2=cv.width/r.width,zs2=scale*view.z;
  view.ox=p.x-(e.clientX-r.left)*f2/zs2;
  view.oy=p.y-(e.clientY-r.top)*f2/zs2;
  clampView();
},{passive:false});
cv.addEventListener('pointerdown',function(e){if(e.button===1){e.preventDefault();pan={x:e.clientX,y:e.clientY};}});
window.addEventListener('pointermove',function(e){
  if(!pan)return;
  view.ox-=(e.clientX-pan.x)*wpp();view.oy-=(e.clientY-pan.y)*wpp();
  pan.x=e.clientX;pan.y=e.clientY;clampView();
});
window.addEventListener('pointerup',function(e){if(e.button===1)pan=null;});
// Nada de menú del navegador, selección ni arrastre de imagen sobre el mapa
['contextmenu','selectstart','dragstart','gesturestart'].forEach(function(ev){
  $('map').addEventListener(ev,function(e){e.preventDefault();});
});
$('map').addEventListener('touchstart',function(e){if(e.target===cv)e.preventDefault();},{passive:false});
// Teclado, al estilo de los juegos de estrategia:
//   flechas: mover la vista (parejo, mientras estén apretadas)      P: pausa        X: atacar        M: esconder el panel
//   Ctrl+1..9: guardar las fichas elegidas como grupo    1..9: elegir ese grupo    1..9 dos veces: llevar la vista al grupo
//   Espacio: centrar la vista en lo elegido     H: ir al cuartel     F: ir pasando por las fábricas     coma u O: próxima ficha ociosa
//   A: elegir todas     Escape: soltar la selección y cerrar menús     F11 o el botón: pantalla completa
var keys={}, groups={}, lastGroup={n:0,t:0}, cycle={fab:0,idle:0};
function lookAt(x,y){view.ox=x-visW()/2;view.oy=y-visH()/2;clampView();}
function lookAtList(list){
  if(!list.length)return;
  var x=0,y=0;list.forEach(function(u){x+=u.x/list.length;y+=u.y/list.length;});
  lookAt(x,y);
}
window.addEventListener('keydown',function(e){
  var k=e.key,low=k.length===1?k.toLowerCase():k;
  if(k.indexOf('Arrow')===0){e.preventDefault();keys[k]=true;return;}
  if(e.code&&e.code.indexOf('Digit')===0&&e.code!=='Digit0'){            // grupos
    e.preventDefault();
    var n=+e.code.slice(5),now=performance.now();
    if(e.ctrlKey||e.metaKey){groups[n]=units.filter(function(u){return u.sel&&u.team===BLUE;}).map(function(u){return u.id;});return;}
    var ids=groups[n]||[],list=units.filter(function(u){return u.team===BLUE&&ids.indexOf(u.id)>=0;});
    if(!list.length)return;
    units.forEach(function(u){u.sel=list.indexOf(u)>=0;});menu=null;stackPin=-1;
    if(lastGroup.n===n&&now-lastGroup.t<450)lookAtList(list);
    lastGroup={n:n,t:now};
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(low==='p'){e.preventDefault();setPaused(!paused);}
  else if(e.code==='Space'){e.preventDefault();lookAtList(units.filter(function(u){return u.sel&&u.team===BLUE;}));}
  else if(low==='a')units.forEach(function(u){u.sel=u.team===BLUE;});
  else if(low==='x')setAttack(!attackMode);
  else if(low==='m')togglePanel();
  else if(low==='h'||low==='f'){                                         // saltar a los edificios propios
    var bs=cities.filter(function(c){return c.owner===BLUE&&c.type===(low==='h'?'hq':'fab');});
    if(!bs.length)return;
    var b=bs[low==='h'?0:(cycle.fab++)%bs.length];
    lookAt(b.x,b.y);
  }
  else if(low===','||low==='o'){                                         // próxima ficha ociosa (quieta, sin pelear, y no médico)
    var idle=units.filter(function(u){return u.team===BLUE&&u.dc<0&&!u.fight&&u.type!=='amb';});
    if(!idle.length)return;
    var it=idle[(cycle.idle++)%idle.length];
    units.forEach(function(u){u.sel=u===it;});menu=null;stackPin=-1;lookAt(it.x,it.y);
  }
  else if(k==='Escape'){stackPin=-1;menu=null;units.forEach(function(u){u.sel=false;});setAttack(false);}
});
window.addEventListener('keyup',function(e){keys[e.key]=false;});
window.addEventListener('blur',function(){keys={};mouse.inside=false;});
// El mouse se sigue en toda la ventana (también sobre el panel), para que los bordes funcionen como en un juego a pantalla completa
window.addEventListener('pointermove',function(e){if(e.pointerType!=='touch'){mouse.x=e.clientX;mouse.y=e.clientY;mouse.inside=true;}});
document.addEventListener('mouseleave',function(){mouse.inside=false;});
// Pantalla completa: ahí el mouse no se puede salir y los bordes mueven el mapa sin fallar; se sale con Escape
function isFull(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function toggleFull(){
  var d=document,el=d.documentElement;
  if(isFull()){if(d.pointerLockElement)d.exitPointerLock();(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
  else{var rq=el.requestFullscreen||el.webkitRequestFullscreen;if(rq)rq.call(el);grabMouse();}
}
$('btnFull').addEventListener('click',toggleFull);
document.addEventListener('fullscreenchange',function(){
  $('btnFull').textContent=isFull()?'⤡':'⛶';
  if(isFull())grabMouse();
  else if(document.pointerLockElement)document.exitPointerLock();
});

// ---------- Mouse capturado ----------
// En pantalla completa el juego "captura" el mouse (Pointer Lock): la flecha del sistema se esconde y no puede irse a otro monitor.
// La flecha que se ve la dibuja el juego (#fakeCur) y se mueve solo dentro de la ventana. Con Escape se libera (y se sale de pantalla completa).
// Mientras está capturado, el navegador manda todos los eventos al mapa con una posición fija; acá se les pone la posición de la flecha
// del juego, y si la flecha está sobre el panel (botones, minimapa) el click se le pasa a lo que haya debajo.
var vcur={x:0,y:0,down:null,mm:false}, fakeCur=$('fakeCur');
function locked(){return document.pointerLockElement===cv;}
function grabMouse(){
  if(!cv.requestPointerLock||locked())return;
  try{var pr=cv.requestPointerLock();if(pr&&pr.catch)pr.catch(function(){});}catch(err){}
}
document.addEventListener('pointerlockchange',function(){
  var on=locked();
  if(on){vcur.x=mouse.x||window.innerWidth/2;vcur.y=mouse.y||window.innerHeight/2;vcur.down=null;vcur.mm=false;moveFake();}
  fakeCur.style.display=on?'block':'none';
  document.body.classList.toggle('grab',on);
});
function moveFake(){fakeCur.style.transform='translate('+vcur.x+'px,'+vcur.y+'px)';}
function synth(type,e){return new PointerEvent(type,{clientX:vcur.x,clientY:vcur.y,button:e.button,buttons:e.buttons,pointerId:e.pointerId,pointerType:'mouse',bubbles:true,cancelable:true});}
function lockFix(e){
  if(!locked()||!e.isTrusted)return;             // (los eventos que fabrica esta misma función pasan de largo)
  if(e.type==='pointermove'){
    vcur.x=Math.max(0,Math.min(window.innerWidth-1,vcur.x+e.movementX));
    vcur.y=Math.max(0,Math.min(window.innerHeight-1,vcur.y+e.movementY));
    moveFake();
  }
  Object.defineProperty(e,'clientX',{value:vcur.x});Object.defineProperty(e,'clientY',{value:vcur.y});
  mouse.x=vcur.x;mouse.y=vcur.y;mouse.inside=true;
  if(e.type==='wheel')return;
  var el=document.elementFromPoint(vcur.x,vcur.y);
  if(vcur.mm){                                         // arrastrando sobre el minimapa: todo va al minimapa hasta soltar
    e.stopImmediatePropagation();
    mmEl.dispatchEvent(synth(e.type,e));
    if(e.type==='pointerup'||e.type==='pointercancel')vcur.mm=false;
    return;
  }
  if(!el||el===cv||drag||rdrag||pan)return;             // sobre el mapa (o en medio de un arrastre del mapa): sigue su camino normal
  e.stopImmediatePropagation();
  if(e.type==='pointerdown'){
    if(el===mmEl){vcur.mm=true;mmEl.dispatchEvent(synth('pointerdown',e));}
    else{
      vcur.down=el;
      if(!$('menuWrap').contains(el))$('menuPop').classList.remove('open');
    }
  }else if(e.type==='pointerup'){
    var b=el.closest?el.closest('button,#handle'):null;
    if(b&&vcur.down&&(vcur.down===b||b.contains(vcur.down))&&e.button===0)b.click();
    vcur.down=null;
  }
}
['pointerdown','pointermove','pointerup','pointercancel','wheel'].forEach(function(t){window.addEventListener(t,lockFix,true);});
// Si no se llegó a capturar o se perdió y sigue en pantalla completa (por ejemplo al volver de otra ventana), cualquier click la recupera
window.addEventListener('pointerdown',function(){if(isFull()&&!locked())grabMouse();},true);

function resize(){
  var r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  var px=Math.max(200,Math.round(r.width*dpr)),py=Math.max(100,Math.round(r.height*dpr));
  if(cv.width!==px||cv.height!==py){cv.width=px;cv.height=py;}
  scale=Math.min(px/WX,py/WY);
  clampView();
}
// unidades del tablero por cada píxel de pantalla
function wpp(){return (cv.width/cv.getBoundingClientRect().width)/(scale*view.z);}
window.addEventListener('resize',resize);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(function(){resize();}).observe(document.getElementById('map'));

var last=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(!paused&&!over){for(var s=0;s<speed;s++)update(dt);}
  // Mover la vista: con las flechas, o llevando el mouse a un borde de la ventana (22 px). Va a la misma velocidad en pantalla
  // con cualquier zoom. Mientras se arrastra un recuadro de selección, los bordes siguen funcionando y el recuadro sigue al mouse.
  if(visW()<WX||visH()<WY){
    var vx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),vy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
    if(!vx&&!vy&&mouse.inside&&!pan&&!mmDrag&&!rdrag&&document.hasFocus()){
      var mg=22,ww=window.innerWidth,wh=window.innerHeight;
      vx=mouse.x<mg?-1:mouse.x>ww-mg?1:0;vy=mouse.y<mg?-1:mouse.y>wh-mg?1:0;
    }
    if(vx||vy){
      var sp=EDGE_SPEED*wpp()*dt;
      view.ox+=vx*sp;view.oy+=vy*sp;clampView();
      if(drag&&drag.rect){var mp=pos({clientX:mouse.x,clientY:mouse.y});drag.x1=mp.x;drag.y1=mp.y;}
    }
  }
  updCursor();
  draw();
  requestAnimationFrame(frame);
}
(function(){var m=/(?:[#?&]|mapa=)(\d+)/.exec(location.hash+location.search);if(m&&+m[1]>=1&&+m[1]<=MAPS)mapN=+m[1];})();
init(mapN>0);resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
